# CI/CD: testar -> construir e publicar a imagem -> implantar na EC2 -> verificar
# (e desfazer o deploy se a verificação falhar).
#
# O deploy só acontece se a EC2 estiver no ar (criada com `make tf-apply`);
# com ela desligada, o job apenas avisa e termina com sucesso.
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (usuário IAM criado no Console)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  AWS_REGION: us-east-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar no GHCR com o GITHUB_TOKEN (sem senha extra)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4 # emula arm64 no runner x86
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-aws # um deploy por vez
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: A EC2 da demo está ligada?
        id: ec2
        run: |
          if scripts/ssm-deploy.sh info >> "$GITHUB_OUTPUT"; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Infra desligada: nada para implantar (rode make tf-apply)."
          fi

      - name: Esperar o k3s ficar pronto (rápido se a EC2 já estiver no ar)
        if: steps.ec2.outputs.up == 'true'
        run: scripts/ssm-deploy.sh wait

      - name: helm upgrade na EC2 (via SSM)
        if: steps.ec2.outputs.up == 'true'
        run: scripts/ssm-deploy.sh deploy ${{ github.sha }}

      - name: Verificar /health e /predict pelo IP público
        if: steps.ec2.outputs.up == 'true'
        run: scripts/verify.sh "${{ steps.ec2.outputs.api_url }}"

      - name: Rollback se o deploy ou a verificação falharem
        if: failure() && steps.ec2.outputs.up == 'true'
        run: scripts/ssm-deploy.sh rollback
