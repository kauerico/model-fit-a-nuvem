# CI/CD: testar -> construir e publicar a imagem -> implantar na EC2 -> verificar
# (e desfazer o deploy se a verificação falhar).
#
# GitHub Secrets (saídas do Terraform): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#                                       EC2_INSTANCE_ID, API_URL
# GitHub Variable:  DEPLOY_ENABLED = true  (desligue após o `make destroy`)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  AWS_REGION: us-east-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar no GHCR com o GITHUB_TOKEN (sem senha extra)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4 # emula arm64 no runner x86
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-aws # um deploy por vez
    permissions:
      contents: read
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # Usuário IAM que só pode mandar comandos SSM para a EC2 da demo
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: helm upgrade na EC2 (via SSM)
        run: scripts/ssm-deploy.sh deploy ${{ github.sha }}

      - name: Verificar /health e /predict pelo IP público
        id: verify
        run: |
          for i in $(seq 12); do
            if curl -sf "${{ secrets.API_URL }}/health"; then
              curl -sf "${{ secrets.API_URL }}/predict" -H 'Content-Type: application/json' \
                -d '{"texto": "Teste automático do pipeline de CI/CD."}'
              exit 0
            fi
            sleep 5
          done
          echo "::error::API não respondeu após o deploy"; exit 1

      - name: Rollback se o deploy ou a verificação falharem
        if: failure()
        run: scripts/ssm-deploy.sh rollback
