# Sobe ou derruba TODA a infraestrutura na AWS (e implanta a app no "up").
# Disparo manual: Actions -> infra -> Run workflow -> up | down
#
# Configuração do repositório (Settings -> Secrets and variables -> Actions):
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (usuário IAM criado no Console)
#              BUDGET_EMAIL                              (recebe os alertas de custo)
#   Variables: TF_STATE_BUCKET                           (bucket S3 do estado do Terraform)
name: infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = criar tudo e implantar | down = apagar tudo"
        type: choice
        options: [up, down]
        required: true

concurrency: infra # nunca dois Terraform ao mesmo tempo

env:
  AWS_REGION: us-east-2
  IMAGE: ghcr.io/${{ github.repository }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan ${{ inputs.action == 'down' && '-destroy' || '' }}

      - name: terraform apply
        run: terraform apply -input=false tfplan

      # ---------- só no "up": esperar o k3s e implantar a app ----------
      - name: Esperar o k3s ficar pronto na EC2
        if: inputs.action == 'up'
        working-directory: .
        run: scripts/ssm-deploy.sh wait

      - name: Escolher a imagem (a deste commit, se o CI já publicou; senão latest)
        if: inputs.action == 'up'
        id: tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" >/dev/null 2>&1; then
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: helm upgrade na EC2 (via SSM)
        if: inputs.action == 'up'
        working-directory: .
        run: scripts/ssm-deploy.sh deploy ${{ steps.tag.outputs.tag }}

      - name: Verificar a API pelo IP público
        if: inputs.action == 'up'
        working-directory: .
        run: |
          URL=$(terraform -chdir=terraform output -raw api_url)
          scripts/verify.sh "$URL"
          echo "### API no ar: $URL" >> "$GITHUB_STEP_SUMMARY"
